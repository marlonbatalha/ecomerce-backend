# Ambiente de desenvolvimento local: API + Oracle XE em container.
# Rodar a partir da raiz do repositório: docker compose -f docker/docker-compose.yml up
#
# `name:` abaixo é obrigatório: sem ele, o nome do projeto Compose seria implícito (nome da pasta,
# "docker" — igual pro docker-compose.staging.yml, que vive na mesma pasta), e os dois arquivos
# passam a competir pelo MESMO serviço "oracle" dentro desse projeto — `docker compose -f
# docker-compose.yml up oracle` recria/destrói o container que estava rodando via
# docker-compose.staging.yml (e vice-versa), mesmo com container_name/porta/volume diferentes.
# Validado na prática em 2026-09-06 (ver plano, achado "compose dev/staging colidindo").
name: ecommerce-dev

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: ecommerce-oracle-dev
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-DevPassword123}
      APP_USER: ecommerce
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-DevPassword123}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ecommerce-api-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: >-
        User Id=ecommerce;Password=${APP_USER_PASSWORD:-DevPassword123};
        Data Source=oracle:1521/XEPDB1
      Jwt__ChaveAssinatura: ${JWT_SIGNING_KEY:-DevSigningKeyChangeMe1234567890}
      Webhook__ChaveSecreta: ${WEBHOOK_SIGNING_KEY:-DevWebhookKeyChangeMe1234567890}
      Cors__AllowedOrigins__0: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      oracle:
        condition: service_healthy

volumes:
  # external: true — volume criado antes do "name:" do projeto existir (ver comentário no topo do
  # arquivo); sem isso, o Compose tenta gerenciar o volume sob o novo prefixo de projeto e perde a
  # referência aos dados já gravados no volume antigo.
  oracle-data:
    name: docker_oracle-data
    external: true
